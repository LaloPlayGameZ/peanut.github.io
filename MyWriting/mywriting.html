<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Library - Portfolio</title>
    <style>
        /* --- Global & Theme Styles --- */
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-gold: #fbbf24;
            --shelf-wood: #332211;
            --shelf-shadow: rgba(0, 0, 0, 0.5);
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 24px 20px;
            height: 100vh;
            box-sizing: border-box;
            overflow: hidden;
        }

        .library-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .library-title {
            font-size: 2.5rem;
            margin-bottom: 10px;
            letter-spacing: -0.025em;
            font-weight: 800;
        }

        .library-subtitle {
            color: var(--text-secondary);
            margin-bottom: 20px;
            font-size: 1.1rem;
        }

        /* --- Shelf Section --- */
        .shelf-section {
            margin-bottom: 16px;
        }

        .shelf-category-title {
            font-size: 1.5rem;
            margin: 10px 0 8px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 5px;
            display: inline-block;
        }

        /* Horizontal Scrolling Shelf Container */
        .bookshelf-track {
            display: flex;
            gap: 25px;
            overflow-x: auto;
            padding: 8px 10px 16px 10px;
            scroll-behavior: smooth;
            /* Wooden shelf board look underneath */
            background: linear-gradient(to bottom, transparent 92%, #29180b 92%, #1a0f06 100%);
            box-shadow: inset 0 -10px 15px -5px var(--shelf-shadow);
            border-radius: 4px;
        }

        /* Custom Scrollbar for Shelves */
        .bookshelf-track::-webkit-scrollbar {
            height: 8px;
        }

        .bookshelf-track::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 4px;
        }

        .bookshelf-track::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 4px;
        }

        /* --- Book Item & Spine --- */
        .book-item {
            position: relative;
            flex-shrink: 0;
            width: 50px;
            height: clamp(130px, 16vh, 180px);
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        /* Spine Styling */
        .book-spine {
            position: absolute;
            width: 50px;
            height: clamp(130px, 16vh, 180px);
            box-sizing: border-box;
            color: inherit;
            text-decoration: none;
            background: linear-gradient(135deg, var(--spine-color-1), var(--spine-color-2));
            border-radius: 4px 2px 2px 4px;
            box-shadow: inset 3px 0 6px rgba(0, 0, 0, 0.3), 2px 5px 10px rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px 5px;
            transform-origin: left center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .spine-title {
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            font-size: 0.9rem;
            font-weight: 600;
            color: #fff;
            text-align: center;
            white-space: nowrap;
            text-overflow: ellipsis;
            overflow: hidden;
            max-height: calc(clamp(130px, 16vh, 180px) - 20px);
            letter-spacing: 0.05em;
        }

        .book-card {
            position: fixed;
            top: 0;
            left: 0;
            width: 260px;
            box-sizing: border-box;
            background: var(--card-bg);
            border-radius: 8px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.4);
            padding: 14px;
            display: flex;
            gap: 15px;
            opacity: 0;
            pointer-events: none;
            transform: translateX(-10px) scale(0.95);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 10;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .book-card.is-visible {
            opacity: 1;
            pointer-events: auto;
            transform: translateX(0) scale(1);
        }

        .book-cover {
            width: 75px;
            height: 110px;
            object-fit: cover;
            border-radius: 4px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            flex-shrink: 0;
        }

        .book-info h3 {
            margin: 0 0 8px 0;
            font-size: 1.1rem;
            color: var(--text-primary);
        }

        .book-info p {
            margin: 0 0 12px 0;
            font-size: 0.85rem;
            color: var(--text-secondary);
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 4;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* --- Hover Interactions --- */
        .book-item:hover .book-spine {
            transform: perspective(1000px) translateY(-8px) rotateY(-10deg);
            box-shadow: inset 3px 0 6px rgba(0, 0, 0, 0.3), 5px 12px 20px rgba(0, 0, 0, 0.6);
        }

        .book-item:hover {
            z-index: 20;
        }

        @media (max-height: 750px) {
            body {
                padding: 12px 10px;
            }

            .library-title {
                font-size: 2rem;
            }

            .library-subtitle {
                font-size: 0.85rem;
                margin-bottom: 8px;
            }

            .shelf-section {
                margin-bottom: 4px;
            }

            .shelf-category-title {
                font-size: 1.1rem;
                margin: 3px 0 2px;
                padding-bottom: 2px;
            }

            .bookshelf-track {
                padding: 5px 6px 10px;
            }

            .book-item,
            .book-spine {
                height: clamp(110px, 18vh, 150px);
            }

            .spine-title {
                max-height: calc(clamp(110px, 18vh, 150px) - 16px);
                font-size: 0.75rem;
            }
        }
    </style>
</head>

<body>

    <div class="library-container">
        <h1 class="library-title">My Library</h1>
        <p class="library-subtitle">Explore my screenplays, short stories, and poetry collections. Hover over a spine to
            preview a book, then click it to open.</p>
        <main id="library"></main>
    </div>

    <script>

        const folderCatalog = {
            "Screenplays": [
                "a routine evening visit",
                "Birds",
                "cant",
                "Cold Love",
                "Dine",
                "Doors3",
                "For you",
                "Garages4",
                "Gone Ghost",
                "Hope",
                "I could",
                "Isntthisfun",
                "KOBS2E6",
                "Kids on bikes (1)",
                "Lag",
                "Lastnight",
                "Nightmare-1",
                "Red Bull",
                "Scumbag",
                "Shhhhh",
                "Shift-updated",
                "Sorry....",
                "TDTDDSM",
                "THE PRIVATE CHAMBERS",
                "Thatwasthen",
                "The box",
                "The Exchange",
                "The Eye Witness",
                "The Hangman",
                "The Marbels - Draft 2",
                "The Place",
                "The Second Bigget Slideshow!",
                "Tuesday Night Circle-updated",
                "you good"
            ],
            "Short Stories": [
                "Birds",
                "Messangers",
            ],
            "Poetry": [
                "The Trail",
            ]
        };

        const bookDetails = {
            "The Trail": {
                image: "book_covers/The Trail.jpg",
                bio: "A poem about the dedication and the preparation to take on our dreams."
            },
            "The Exchange": {
                image: "book_covers/The Exchange.jpg",
                bio: "A short story about a man who is forced to confront his past and the consequences of his actions."
            }
        };

        const books = Object.entries(folderCatalog).flatMap(([folder, titles]) =>
            titles
                .sort((firstTitle, secondTitle) => firstTitle.localeCompare(secondTitle))
                .map(title => {
                    const details = bookDetails[title] || {};
                    return {
                        folder,
                        shelf: folder,
                        title,
                        description: details.bio || `${folder} PDF`,
                        image: details.image || "https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?auto=format&fit=crop&w=300&q=80"
                    };
                })
        );

        const colorThemes = [
            ["#be123c", "#e11d48"],
            ["#c2410c", "#ea580c"],
            ["#a16207", "#ca8a04"],
            ["#166534", "#16a34a"],
            ["#0f766e", "#0d9488"],
            ["#075985", "#0284c7"],
            ["#3730a3", "#4f46e5"],
            ["#6b21a8", "#9333ea"],
            ["#9f1239", "#be185d"]
        ];

        const shuffledColors = [...colorThemes].sort(() => Math.random() - 0.5);
        const shelves = Object.keys(folderCatalog);
        const library = document.querySelector("#library");
        const pdfRoot = "pdfs";
        let colorIndex = 0;

        shelves.forEach(shelfName => {
            const section = document.createElement("section");
            section.className = "shelf-section";
            section.innerHTML = `<h2 class="shelf-category-title">${shelfName}</h2><div class="bookshelf-track"></div>`;
            const track = section.querySelector(".bookshelf-track");

            books.filter(book => book.shelf === shelfName).forEach(book => {
                const item = document.createElement("article");
                const [colorOne, colorTwo] = shuffledColors[colorIndex % shuffledColors.length];
                colorIndex++;
                item.className = "book-item";
                item.style.setProperty("--spine-color-1", colorOne);
                item.style.setProperty("--spine-color-2", colorTwo);
                const pdfLink = `${pdfRoot}/${encodeURIComponent(book.folder)}/${encodeURIComponent(book.title)}.pdf`;
                item.innerHTML = `
                    <a href="${pdfLink}" target="_blank" rel="noopener" class="book-spine" aria-label="Open ${book.title}">
                        <span class="spine-title">${book.title}</span>
                    </a>
                    <div class="book-card">
                        <img src="${book.image}" alt="Cover of ${book.title}" class="book-cover">
                        <div class="book-info">
                            <h3>${book.title}</h3>
                            <p>${book.description}</p>
                        </div>
                    </div>
                `;
                track.appendChild(item);
                addHoverPanelBehavior(item, item.querySelector(".book-card"));
            });

            library.appendChild(section);
        });

        function addHoverPanelBehavior(item, card) {
            let hideTimeout;

            const showCard = () => {
                clearTimeout(hideTimeout);
                const itemBounds = item.getBoundingClientRect();
                const cardWidth = 260;
                const cardHeight = card.offsetHeight;
                const gap = 10;
                const left = Math.min(itemBounds.right + gap, window.innerWidth - cardWidth - gap);
                const top = itemBounds.bottom + cardHeight + gap <= window.innerHeight
                    ? itemBounds.bottom + gap
                    : Math.max(gap, itemBounds.top - cardHeight - gap);

                card.style.left = `${Math.max(gap, left)}px`;
                card.style.top = `${top}px`;
                card.classList.add("is-visible");
            };

            const hideCard = () => {
                hideTimeout = setTimeout(() => card.classList.remove("is-visible"), 120);
            };

            item.addEventListener("mouseenter", showCard);
            item.addEventListener("mouseleave", hideCard);
            card.addEventListener("mouseenter", () => clearTimeout(hideTimeout));
            card.addEventListener("mouseleave", hideCard);
            window.addEventListener("resize", () => {
                if (card.classList.contains("is-visible")) showCard();
            });
        }
    </script>

</body>

</html>
